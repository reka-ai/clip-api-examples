[package]
name = "reka-clip-examples"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "clip_generator"
path = "src/bin/clip_generator.rs"

[[bin]]
name = "check_status"
path = "src/bin/check_status.rs"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
